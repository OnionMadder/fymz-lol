<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madderverse - We've Moved!</title>
    <link rel="canonical" href="https://madderverse.org/" />
    <meta name="description" content="FYMZ has moved to madderverse.org. Same fun, free, ad-free games for kids - new home." />
    <meta http-equiv="refresh" content="0; url=https://madderverse.org/" />
    <script>
        (function () {
            var target = 'https://madderverse.org';
            var path = window.location.pathname || '/';
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            window.location.replace(target + path + search + hash);
        })();
    </script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; }
        a { color: #00ffcc; }
        h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
        p { margin: 0.4rem 0; opacity: 0.85; }
    </style>
</head>
<body>
    <main>
        <h1>FYMZ has moved to Madderverse</h1>
        <p>Sending you to the new home at <a href="https://madderverse.org/">madderverse.org</a>&hellip;</p>
        <p>If you aren't redirected, <a href="https://madderverse.org/">click here</a>.</p>
    </main>
</body>
</html>
